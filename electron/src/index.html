<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LazeeBrowse.ai</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-container">
  <!-- TITLE BAR -->
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="app-logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="app-title">LazeeBrowse.ai</span>
      <div class="server-badge" id="serverBadge">
        <span class="badge-dot"></span>
        <span class="badge-text">Disconnected</span>
      </div>
    </div>
    <div class="titlebar-center">
      <div class="address-bar" id="addressBar">
        <svg class="address-icon" width="12" height="12" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <input type="text" id="urlInput" placeholder="Enter URL or search... (Ctrl+Enter)" autocomplete="off" />
        <div class="url-dropdown hidden" id="urlDropdown"></div>
      </div>
    </div>
    <div class="titlebar-right">
      <button class="nav-btn" id="backBtn" title="Back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn" id="forwardBtn" title="Forward">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn" id="refreshBtn" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn theme-btn" id="themeToggle" title="Toggle theme">
        <svg class="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <!-- INSTRUCTION BAR -->
  <div class="instruction-bar" id="instructionBar">
    <div class="attached-files-bar" id="attachedFilesBar"></div>
    <div class="instruction-wrapper">
      <button class="attach-btn" id="attachBtn" onclick="pickFilesForAttachment()" title="Attach files">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="deepdive-btn" id="deepDiveBtn" onclick="toggleDeepDive()" title="Deep Dive: explore multiple reasoning paths">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Dive</span>
      </button>
      <textarea
        id="instructionInput"
        placeholder="Tell the AI what to do..."
        rows="1"
        maxlength="2000"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendInstruction()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="instruction-footer">
      <span class="thinking-text" id="agentStatus">Ready</span>
      <span class="char-count" id="charCount"></span>
    </div>
  </div>

  <!-- THINKING BAR -->
  <div class="thinking-bar" id="thinkingBar">
    <div class="thinking-dots">
      <span></span><span></span><span></span>
    </div>
    <span class="thinking-label">AI is working...</span>
  </div>

  <!-- MAIN CONTENT: sidebar + browser -->
  <div class="main-content">
    <!-- FILE SIDEBAR -->
    <div class="file-sidebar" id="fileSidebar">
      <div class="sidebar-header">
        <span>Files</span>
        <button class="sidebar-refresh-btn" id="sidebarRefresh" onclick="refreshFileTree()" title="Refresh file tree">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="sidebar-content" id="fileTree"></div>
    </div>
    <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
    <button class="sidebar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- BROWSER VIEW -->
    <webview id="browserView" class="browser-view" src="https://www.google.com" autosize="on"></webview>

    <!-- SAVE OVERLAY -->
    <div class="save-overlay" id="saveOverlay">
      <button class="save-overlay-btn" id="saveOverlayBtn" title="Save current page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="save-menu hidden" id="saveMenu">
        <button id="savePdfBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Save as PDF
        </button>
        <button id="savePptBtn" disabled title="Coming soon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Save as PPT
          <span class="save-menu-badge">soon</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- LOG PANEL (fixed bottom) -->
<div class="log-panel" id="logPanel">
  <div class="log-resize-handle" id="logResizeHandle"></div>
  <div class="log-header" onclick="toggleLogPanel()">
    <span>Activity Log</span>
    <button class="log-toggle" id="logToggle">
      <span class="log-badge hidden" id="logBadge"></span>
      ^
    </button>
  </div>
  <div class="log-content" id="logContent"></div>
</div>

<!-- CONNECT SCREEN (overlay) -->
<div class="connect-overlay" id="connectOverlay">
  <div class="connect-card">
    <div class="connect-left">
      <div class="connect-left-header">
        <h2>Recent Projects</h2>
      </div>
      <div class="recent-projects-list" id="recentProjectsList">
        <div class="recent-project-empty">No recent projects</div>
      </div>
    </div>
    <div class="connect-right">
      <div class="connect-right-header">
        <div class="connect-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.2"/>
            <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>LazeeBrowse.ai</h1>
      </div>

      <div class="form-group">
        <label for="modelName">MODEL</label>
        <select id="modelName" autocomplete="off"></select>
        <label for="llmApiKey">API KEY</label>
        <input type="password" id="llmApiKey" value="" placeholder="Enter your API key" autocomplete="off" />
        <label>PROJECT</label>
        <div class="project-display" id="projectDisplay" onclick="selectFolder()">
          <div class="project-name" id="projectName">Select a project folder</div>
          <div class="project-path" id="projectPath"></div>
        </div>
        <button class="create-project-btn" onclick="selectFolder()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Create New Project
        </button>
        <label class="tg-toggle-label">TELEGRAM MODE
          <span class="tg-toggle-wrap">
            <input type="checkbox" id="telegramToggle" />
            <span class="tg-switch"></span>
          </span>
        </label>
        <div class="tg-token-row hidden" id="telegramTokenRow">
          <input type="password" id="telegramToken" value="" placeholder="Enter your Telegram bot token" autocomplete="off" />
        </div>
      </div>

      <button class="connect-btn" id="connectBtn" onclick="connectToAgent()">
        <span>Connect</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="connect-error" id="connectError"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
