<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws://localhost:8000 http://localhost:8000; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- TITLE BAR -->
<div class="titlebar">
  <div class="titlebar-center">
    <div class="app-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="app-title">Agent Chat</span>
    <div class="server-badge" id="serverBadge">
      <span class="badge-dot"></span>
      <span class="badge-text">Disconnected</span>
    </div>
  </div>
  <!-- <div class="titlebar-controls">
    <button class="ctrl-btn minimize" onclick="window.electronAPI?.minimize()">&#x2013;</button>
    <button class="ctrl-btn maximize" onclick="window.electronAPI?.maximize()">&#x25A1;</button>
    <button class="ctrl-btn close" onclick="window.electronAPI?.close()">&#x2715;</button>
  </div> -->
</div>

<!-- CONNECT SCREEN -->
<div class="screen" id="connectScreen">
  <div class="connect-card">
    <div class="connect-glow"></div>
    <div class="connect-header">
      <div class="connect-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Agent Chat</h1>
      <p>Connect to your AI agent via WebSocket</p>
    </div>

    <div class="form-group">
      <label for="serverInput">SERVER URL</label>
      <input type="text" id="serverInput" value="ws://localhost:8000" autocomplete="off" />
      <label for="llmApiKey">DEEPSEEK API KEY</label>
      <input type="text" id="llmApiKey" value="sk-*******************" autocomplete="off" />
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectToAgent()">
      <span>Connect</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="connect-error" id="connectError"></div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div class="screen hidden" id="chatScreen">
  <div class="chat-layout">

    <!-- LEFT: LOGS PANEL -->
    <div class="side-panel left collapsed" id="logsPanel">
      <div class="panel-header">
        <span>Logs</span>
        <button onclick="togglePanel('logsPanel')">⮜</button>
      </div>
      <div class="panel-content" id="logsContent"></div>
    </div>

  <!-- CENTER: MAIN CHAT -->
  <div class="chat-main">
    <!-- HEADER BAR -->
    <div class="chat-header">
      <div class="agent-identity">
        <div class="agent-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
            <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="agent-info">
          <span class="agent-name">AI Agent</span>
          <span class="agent-status" id="agentStatus">Ready</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" onclick="clearHistory()" title="Clear conversation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="disconnect()" title="Disconnect">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages-area" id="messagesArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1"/>
            <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="empty-title">How can I help you?</p>
        <p class="empty-sub">Send a message to start the conversation.</p>
      </div>
    </div>

    <!-- THINKING INDICATOR -->
    <div class="thinking-bar" id="thinkingBar">
      <div class="agent-avatar-sm">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          placeholder="Message the agent…"
          rows="1"
          maxlength="4000"
          onkeydown="handleKeydown(event)"
          oninput="handleInput()"
        ></textarea>
        <div class="input-footer">
          <span class="char-count" id="charCount"></span>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="input-hint">Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</p>
    </div>


    </div> <!-- END chat-main -->

  <!-- RIGHT: FILE TREE -->
  <div class="side-panel right collapsed" id="filesPanel">
    <div class="panel-header">
      <button onclick="togglePanel('filesPanel')">⮞</button>
      <span>Files</span>
    </div>
    <div class="panel-content" id="filesContent"></div>
  </div>


</div>

<script src="app.js"></script>
</body>
</html>
